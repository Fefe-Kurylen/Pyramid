# Vérifie que l'appli iPhone se compile (Mac de GitHub) et fabrique un .ipa non signé
# (à signer avec son identifiant Apple via Sideloadly / AltStore, ou avec le compte Apple Developer)
name: iPhone - compilation
on:
  push:
    paths: ['mobile/**', 'web/**', 'windows/app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 make-mobile.py
      - run: npx cap sync ios
      - name: Compilation pour le simulateur iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
      - name: Fabrication de l'appli iPhone (.ipa non signé)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build | tail -n 20
          test ${PIPESTATUS[0]} -eq 0
          V=$(node -p "require('./package.json').version")
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../Pyramid-PDF-iPhone-$V.ipa" Payload)
          ls -la build/*.ipa
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ipa/Payload/App.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: pyramid-pdf-iphone
          path: mobile/build/*.ipa
